<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="旭馳車業更多服務：社群、保險、原廠官網">
<title>旭馳更多服務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: a garage key-board — links grouped by 分類 from the sheet, each a chunky tag with an icon tile. Single dark look by choice (shop's black/orange). */
:root{
  color-scheme: dark;
  --bg:#0d0d0d;
  --panel:#171717;
  --panel2:#1f1f1f;
  --line:#2c2c2c;
  --org:#ff8a00;
  --org2:#ffb35c;
  --txt:#f3eee6;
  --dim:#9d968b;
  --f-disp:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(255,138,0,.05) 0),linear-gradient(90deg,transparent 0 calc(100% - 1px),rgba(255,138,0,.05) 0);
  background-size:28px 28px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--org);padding-bottom:8px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .en{font-family:var(--f-disp);font-size:44px;letter-spacing:.06em;color:var(--org)}
.brand .zh{font-weight:900;font-size:15px;letter-spacing:.3em;margin-top:2px}
.shop{font-size:12px;color:var(--dim);letter-spacing:.1em}

section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;letter-spacing:.2em;color:var(--org2)}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h2 .tag{font-family:var(--f-disp);font-size:18px;letter-spacing:.06em;color:#111;background:var(--org);padding:0 8px;border-radius:5px;box-shadow:2px 2px 0 #000;transform:rotate(-3deg)}

.list{display:flex;flex-direction:column;gap:10px}
a.item{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  color:inherit;text-decoration:none;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
a.item:active{transform:translate(2px,2px)}
a.item:hover,a.item:focus-visible{border-color:var(--org);outline:none}
.ico{flex:0 0 48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--org);color:var(--org)}
.ico svg{width:26px;height:26px}
.ico.word{font-family:var(--f-disp);font-size:15px;letter-spacing:.04em;line-height:1;text-align:center;padding:2px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column}
.meta b{font-size:17px;font-weight:900;overflow-wrap:anywhere}
.meta span{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.go{flex:0 0 auto;color:var(--org);font-family:var(--f-disp);font-size:22px}

.skel{height:72px;border-radius:16px;background:linear-gradient(90deg,var(--panel) 0,#222 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--txt);margin-bottom:4px}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--dim)}
footer a{color:var(--org2)}
@media (prefers-reduced-motion:reduce){.skel{animation:none}a.item{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="en">MORE</span><span class="zh">更多服務</span></div>
    <span class="shop">旭馳車業</span>
  </header>

  <main id="app" aria-live="polite">
    <section><div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></section>
  </main>

  <footer>有問題請聯絡旭馳車業｜<a href="tel:0222048272">02-2204-8272</a></footer>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdTz4DcFqcX9n-b8AlSZghw6jCG6NgjjH7PYlfXVHTIzUQrxt6yVziCPfnm9GiYbYwJg/exec";
const CACHE_KEY = "xuchi-more-links";

const SVG = {
  instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  line:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5c0 4.1-4 7.5-9 7.5-1 0-2-.1-2.9-.4L5 21l.9-3.6C4.1 16 3 13.9 3 11.5 3 7.4 7 4 12 4s9 3.4 9 7.5z"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  facebook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h2z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>'
};
const WORD = { sym:"SYM", yamaha:"YAMA<br>HA", kymco:"KYM<br>CO" };

function guessIcon(icon, url){
  const k = (icon || "").toLowerCase();
  if (SVG[k] || WORD[k]) return k;
  if (k === "ig") return "instagram";
  if (k === "抖音" || k === "douyin") return "tiktok";
  const u = (url || "").toLowerCase();
  if (u.includes("instagram.com")) return "instagram";
  if (u.includes("tiktok.com") || u.includes("douyin")) return "tiktok";
  if (u.includes("lin.ee") || u.includes("line.me")) return "line";
  if (u.includes("facebook.com") || u.includes("fb.com")) return "facebook";
  if (u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
  if (u.includes("maps.app") || u.includes("google.com/maps") || u.includes("goo.gl/maps")) return "map";
  if (u.startsWith("tel:")) return "phone";
  if (u.includes("sym")) return "sym";
  if (u.includes("yamaha")) return "yamaha";
  if (u.includes("kymco")) return "kymco";
  return "link";
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:|tel:)/i.test(u) ? u : "#";

function render(links){
  const app = document.getElementById("app");
  if (!links.length){
    app.innerHTML = '<div class="empty"><b>目前還沒有上架的服務</b>晚點再來看看，或直接打電話給我們。</div>';
    return;
  }
  const groups = [];
  const byName = {};
  links.forEach(l => {
    const g = l.group || "其他";
    if (!byName[g]){ byName[g] = []; groups.push(g); }
    byName[g].push(l);
  });
  app.innerHTML = groups.map((g, gi) => `
    <section>
      <h2><span class="tag">${String(gi + 1).padStart(2, "0")}</span>${esc(g)}</h2>
      <div class="list">
        ${byName[g].map(l => {
          const k = guessIcon(l.icon, l.url);
          const ico = WORD[k] ? `<span class="ico word" aria-hidden="true">${WORD[k]}</span>` : `<span class="ico" aria-hidden="true">${SVG[k]}</span>`;
          return `<a class="item" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">
            ${ico}
            <span class="meta"><b>${esc(l.name)}</b>${l.desc ? `<span>${esc(l.desc)}</span>` : ""}</span>
            <span class="go" aria-hidden="true">›</span>
          </a>`;
        }).join("")}
      </div>
    </section>`).join("");
  app.style.display = "flex";
  app.style.flexDirection = "column";
  app.style.gap = "22px";
}

let shown = false;
try {
  const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
  if (Array.isArray(c)) { render(c); shown = true; }
} catch (e) {}

fetch(API_URL + "?api=links")
  .then(r => r.json())
  .then(d => {
    if (!d.ok) throw new Error("bad");
    render(d.links || []);
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(d.links || [])); } catch (e) {}
  })
  .catch(() => {
    if (!shown) document.getElementById("app").innerHTML =
      '<div class="empty"><b>連線有點慢</b>請稍後重新整理，或直接打電話給我們。</div>';
  });
</script>
</body>
</html>
